<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Summit Registrations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#16161a;--muted:#6b6b76;--line:#e6e4df;
  --accent:#5b4bff;--accent-soft:#ecebff;--bar-bg:#efeee9;--other:#b9b7c4;
}
:root[data-theme="dark"]{
  --bg:#0f0f13;--card:#18181f;--ink:#f2f2f5;--muted:#9a9aa8;--line:#2a2a34;
  --accent:#8a7dff;--accent-soft:#25224a;--bar-bg:#23232c;--other:#55535f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:40px 16px 80px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.sub{color:var(--muted);font-size:14px}
.toggle{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat .n{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px;margin-top:2px}
h2{font-size:17px;font-weight:700;margin:0 0 16px}
.board{margin-bottom:16px}
.row{display:grid;grid-template-columns:28px minmax(110px,180px) 1fr 76px;align-items:center;gap:12px;padding:9px 8px;border-radius:10px;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:inherit;font:inherit}
.row:hover{background:var(--bar-bg)}
.row.active{background:var(--accent-soft)}
.rank{color:var(--muted);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.who{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;background:var(--bar-bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.row.muted .bar i{background:var(--other)}
.row.muted .who{color:var(--muted)}
.cnt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.cnt small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.divider{height:1px;background:var(--line);margin:8px 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:14px Inter,sans-serif}
.tools input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font:500 13px Inter,sans-serif;cursor:pointer}
.group{margin-bottom:14px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.ghead h3{margin:0;font-size:16px;font-weight:700}
.ghead span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
ol.people{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 16px}
ol.people li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
ol.people li b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.people li em{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.empty{color:var(--muted);text-align:center;padding:32px}
footer{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
@media (max-width:600px){
  .stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}
  .row{grid-template-columns:22px minmax(0,1fr) 64px;row-gap:6px}
  .row .bar{grid-column:2/4;grid-row:2}
  .card{padding:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Marblism · AI Summit</div>
      <h1>Registrations</h1>
      <div class="sub" id="updated"></div>
    </div>
    <button class="toggle" id="theme" type="button">Dark mode</button>
  </header>

  <section class="stats">
    <div class="card stat"><div class="n" id="total">0</div><div class="l">Total registrants</div></div>
    <div class="card stat"><div class="n" id="referred">0</div><div class="l">With a referrer</div></div>
    <div class="card stat"><div class="n" id="partners">0</div><div class="l">Referrers with signups</div></div>
  </section>

  <section class="card board">
    <h2>Registrants by referrer</h2>
    <div id="board"></div>
  </section>

  <div class="tools">
    <input id="q" type="search" placeholder="Search a name" autocomplete="off">
    <button class="chip" id="clear" type="button" hidden>Show all referrers</button>
  </div>

  <section id="list"></section>

  <footer>Names and signup dates only. Contact details are kept private.</footer>
</div>

<script>
(() => {
  const {people, updated} = window.REG_DATA;
  const UNPARTNERED = ["Not specified"];
  const $ = id => document.getElementById(id);
  let active = null;

  // theme: always opens light, dark only via toggle
  const root = document.documentElement;
  $("theme").onclick = () => {
    const dark = root.dataset.theme !== "dark";
    root.dataset.theme = dark ? "dark" : "light";
    $("theme").textContent = dark ? "Light mode" : "Dark mode";
  };

  const groups = {};
  people.forEach(p => (groups[p.ref] ||= []).push(p));
  Object.values(groups).forEach(g => g.sort((a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name)));
  const order = Object.keys(groups).sort((a, b) => {
    const ua = UNPARTNERED.includes(a), ub = UNPARTNERED.includes(b);
    if (ua !== ub) return ua ? 1 : -1;
    return groups[b].length - groups[a].length || a.localeCompare(b);
  });
  const partners = order.filter(r => !UNPARTNERED.includes(r));
  const total = people.length;
  const max = Math.max(...order.map(r => groups[r].length));

  $("total").textContent = total;
  $("referred").textContent = partners.reduce((s, r) => s + groups[r].length, 0);
  $("partners").textContent = partners.length;
  const fmt = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"});
  $("updated").textContent = "Updated " + fmt(updated);

  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function renderBoard() {
    let rank = 0, html = "", dividerDone = false;
    for (const r of order) {
      const n = groups[r].length, muted = UNPARTNERED.includes(r);
      if (muted && !dividerDone) { html += '<div class="divider"></div>'; dividerDone = true; }
      html += `<button type="button" class="row${muted ? " muted" : ""}${active === r ? " active" : ""}" data-ref="${esc(r)}">
        <span class="rank">${muted ? "" : ++rank}</span>
        <span class="who">${esc(r)}</span>
        <span class="bar"><i style="width:${(n / max * 100).toFixed(1)}%"></i></span>
        <span class="cnt">${n}<small>${(n / total * 100).toFixed(0)}%</small></span>
      </button>`;
    }
    $("board").innerHTML = html;
    $("board").querySelectorAll(".row").forEach(b => b.onclick = () => {
      active = active === b.dataset.ref ? null : b.dataset.ref;
      render();
      if (active) $("list").scrollIntoView({behavior: "smooth", block: "start"});
    });
  }

  function renderList() {
    const q = $("q").value.trim().toLowerCase();
    let html = "";
    for (const r of order) {
      if (active && r !== active) continue;
      const list = groups[r].filter(p => !q || p.name.toLowerCase().includes(q));
      if (!list.length) continue;
      html += `<div class="card group"><div class="ghead"><h3>${esc(r)}</h3><span>${list.length}${q ? " of " + groups[r].length : ""} registrant${groups[r].length === 1 ? "" : "s"}</span></div>
        <ol class="people">${list.map(p => `<li><b>${esc(p.name)}</b><em>${fmt(p.date).replace(/, \d{4}$/, "")}</em></li>`).join("")}</ol></div>`;
    }
    $("list").innerHTML = html || '<div class="card empty">No registrants match that search.</div>';
    $("clear").hidden = !active;
  }

  function render() { renderBoard(); renderList(); }
  $("q").oninput = renderList;
  $("clear").onclick = () => { active = null; render(); };
  render();
})();
</script>
